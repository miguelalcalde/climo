[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-tree"
version = "0.1.0"
description = "Generate Markdown, JSON, or Codex skill files from CLI help trees."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
skill-tree = "help_tree.cli:main"

[tool.setuptools.packages.find]
include = ["help_tree*"]
