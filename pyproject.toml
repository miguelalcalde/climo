[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "climo"
version = "0.1.0"
description = "Generate Markdown, JSON, or Codex skill files from CLI help trees."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
keywords = ["cli", "documentation", "skills", "codex"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities",
]

[project.scripts]
climo = "help_tree.cli:main"

[project.urls]
Homepage = "https://github.com/miguelalcalde/climo"
Repository = "https://github.com/miguelalcalde/climo"
Issues = "https://github.com/miguelalcalde/climo/issues"

[tool.setuptools.packages.find]
include = ["help_tree*"]
